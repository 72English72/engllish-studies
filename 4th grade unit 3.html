<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2. Sınıf T2 Kelime Öğren & Oyna</title>
<style>
  :root { --primary:#3b82f6; --secondary:#f59e0b; --bg:#eff6ff; --text:#1e293b; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; min-height:100%; }
  body { background:linear-gradient(160deg,#eef6ff 0%,#f8fbff 58%,#fff8eb 100%); color:var(--text); display:flex; flex-direction:column; overflow:hidden; min-height:100dvh; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }

  .tabs { display:flex; gap:7px; padding:8px 10px; background:rgba(255,255,255,.97); box-shadow:0 4px 16px rgba(27,66,120,.08); z-index:10; flex-shrink:0; }
  .tab-btn { flex:1; padding:11px 3px; border:0; border-bottom:3px solid transparent; border-radius:13px 13px 10px 10px; background:#f1f5fb; font-size:clamp(12px,3.5vw,17px); font-weight:900; color:#64748b; cursor:pointer; white-space:nowrap; min-width:0; transition:background .18s ease,color .18s ease; }
  .tab-btn.active { color:#1759b8; background:#e7f0ff; border-bottom-color:#3478e5; }

  .content { flex:1; overflow-y:auto; position:relative; -webkit-overflow-scrolling:touch; min-height:0; }
  .panel { display:none; padding:clamp(10px,3vw,18px); min-height:100%; animation:fadeIn .22s ease; }
  .panel.active { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #learnPanel, #gamePanel { padding-bottom:22px; }
  button, select { font:inherit; }
  button:focus-visible, select:focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  .learn-card { background:rgba(255,255,255,.98); width:100%; max-width:470px; border-radius:28px; padding:clamp(14px,4vw,24px) 18px; text-align:center; box-shadow:0 14px 34px rgba(40,83,145,.14); border:2px solid #d5e5ff; }
  .visual { display:block; width:min(100%,310px); height:clamp(150px,42vw,205px); margin:0 auto 12px; overflow:hidden; border-radius:22px; background:linear-gradient(145deg,#edf7ff,#fff5d8); border:1px solid #d8e8f7; box-shadow:inset 0 -5px 0 rgba(42,92,142,.04); }
  .visual svg { display:block; width:100%; height:100%; }
  .en-word { font-size:clamp(26px,8vw,34px); font-weight:900; color:var(--primary); margin-bottom:4px; word-break:break-word; }
  .tr-word { font-size:clamp(16px,5vw,20px); font-weight:600; color:#64748b; margin-bottom:20px; }
  .controls { display:flex; gap:10px; justify-content:center; margin-top:18px; width:100%; max-width:400px; }
  .btn { flex:1; padding:14px 8px; border:none; border-radius:16px; font-size:clamp(15px,4.5vw,18px); font-weight:bold; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 4px 15px rgba(0,0,0,.1); touch-action:manipulation; }
  .btn:active { transform:scale(.96); }
  .btn-prev { background:#94a3b8; }
  .btn-play { background:var(--secondary); flex:1.6; font-size:clamp(16px,5vw,22px); }
  .btn-next { background:var(--primary); }

  .game-header { width:100%; max-width:400px; display:flex; justify-content:space-between; margin-bottom:16px; font-weight:900; font-size:clamp(15px,4.5vw,18px); }
  .question-box { text-align:center; margin-bottom:20px; width:100%; max-width:400px; background:#fff; padding:24px 16px; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,.05); border:2px solid #bfdbfe; }
  .question-text { font-size:clamp(24px,8vw,32px); font-weight:900; color:var(--primary); word-break:break-word; }
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:430px; }
  .option-btn { min-height:58px; background:#fff; border:2px solid #c9dcfb; border-radius:16px; padding:13px 8px; font-size:clamp(14px,4.2vw,19px); font-weight:900; color:var(--text); cursor:pointer; text-align:center; overflow-wrap:anywhere; touch-action:manipulation; box-shadow:0 3px 0 #e2ebfa; }
  .option-btn.correct { background:#dcfce7; border-color:#22c55e; color:#116c32; }
  .option-btn.wrong { background:#fee2e2; border-color:#ef4444; color:#9b1c1c; }
  #gameFeedback { margin-top:16px; font-size:clamp(16px,5vw,22px); font-weight:900; min-height:32px; text-align:center; width:100%; max-width:400px; }

  .footer { flex-shrink:0; background:rgba(255,255,255,.94); padding:7px 8px; text-align:center; font-size:11px; font-weight:800; color:#718096; border-top:1px solid #e2eaf5; letter-spacing:.2px; }

  /* ===== ZIPLAMA TAM EKRAN ===== */
  #jumpPanel.panel { padding:0; }
  #jumpPanel.panel.active { display:flex; flex-direction:column; padding:0; height:100%; overflow:hidden; justify-content:stretch; align-items:stretch; }
  .jump-full { display:flex; flex-direction:column; width:100%; height:100%; min-height:0; }

  .jump-topbar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 8px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.05); font-weight:900; color:#263c57; font-size:clamp(11px,3.4vw,14px); z-index: 10;}
  .jump-topbar > span { background:#eef5ff; border-radius:999px; padding:4px 9px; white-space:nowrap; display:inline-flex; align-items:center; gap:3px; }

  .jump-cat-row { flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:6px; padding:5px 8px; background:#f5f9ff; font-weight:800; color:#263c57; font-size:clamp(11px,3.3vw,13px); border-bottom:1px solid #e2e8f0; z-index: 10;}
  .jump-select { padding:5px 8px; border:2px solid #bfdbfe; border-radius:8px; font-weight:800; font-size:clamp(11px,3.3vw,13px); max-width:60%; background:#fff; color:#263c57; }

  .jump-stage { flex:1; position:relative; min-height:0; background:#a2d4f5; overflow:hidden; touch-action:manipulation; border-top:3px solid rgba(255,255,255,.65); border-bottom:3px solid rgba(255,255,255,.65); }
  #jumpCanvas { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:manipulation; cursor:pointer; }

  /* Türkçe kelime kutusu */
  .jump-tr-banner {
    position:absolute; left:50%; bottom:clamp(72px,16%,110px); transform:translateX(-50%);
    background:linear-gradient(135deg,#fff,#fff7d6); color:#34445b;
    padding:11px 16px; border-radius:22px;
    font-size:clamp(20px,5.8vw,27px); font-weight:900;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1), inset 0 -4px 0 rgba(0,0,0,0.03); 
    border: 3px solid #ffffff; outline:2px solid rgba(37,99,235,.14);
    z-index:4; text-align:center; pointer-events:none; width:min(82%,340px);
    line-height:1.2;
  }

  .jump-controls { flex-shrink:0; display:flex; justify-content:center; gap:8px; padding:8px max(8px,env(safe-area-inset-right)) 10px max(8px,env(safe-area-inset-left)); background:#fff; box-shadow:0 -2px 8px rgba(0,0,0,.05); }
  .jump-controls button { border:0; border-radius:12px; padding:12px 8px; font-size:clamp(11px,3.3vw,15px); font-weight:900; background:linear-gradient(135deg,#ff8a3d,#f05b25); color:#fff; cursor:pointer; box-shadow:0 3px 0 #c8471d; touch-action:manipulation; flex:1; max-width:240px; }
  .jump-controls button:active { transform:translateY(2px); box-shadow:0 1px 0 #c8471d; }
  .jump-controls button.secondary { background:linear-gradient(135deg,#fff,#eaf2fa); color:#263c57; box-shadow:0 3px 0 #c8d5e2; }

  .jump-feedback { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); min-height:24px; text-align:center; font-size:clamp(13px,3.9vw,17px); font-weight:900; color:#263c57; padding:6px 14px; line-height:1.3; background:rgba(255,255,255,.92); border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.15); max-width:92%; pointer-events:none; z-index:5; }
  .jump-feedback:empty { display:none; }
  @media (max-width:380px) {
    .tabs { padding:6px; gap:5px; }
    .tab-btn { padding:10px 2px; font-size:12px; }
    .panel { padding:10px; }
    .controls { gap:7px; }
    .btn { padding:12px 5px; border-radius:13px; }
    .game-header { margin-bottom:10px; }
    .question-box { padding:17px 12px; margin-bottom:13px; }
    .options-grid { gap:8px; }
    .option-btn { min-height:54px; }
    .jump-cat-row { gap:4px; }
    .jump-select { max-width:58%; }
  }
  @media (max-height:650px) {
    .learn-card { padding:14px; }
    .visual { font-size:50px; margin-bottom:2px; }
    .tr-word { margin-bottom:8px; }
    .controls { margin-top:10px; }
    .question-box { padding:12px; margin-bottom:10px; }
    .jump-topbar { padding:4px 6px; }
    .jump-cat-row { padding:4px 6px; }
    .jump-controls { padding:5px 7px; }
  }
</style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">📚 Kelimeler</button>

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    const activeButton = Array.from(document.querySelectorAll('.tab-btn'))
      .find(b => b.getAttribute('onclick') && b.getAttribute('onclick').includes("'" + tabId + "'"));
    if (activeButton) activeButton.classList.add('active');
    document.getElementById(tabId + 'Panel').classList.add('active');
    if (tabId === 'game') initGame();
    if (tabId === 'learn') playCurrentWord();
    if (tabId === 'jump') startJumpGame();
  }

  const synth = window.speechSynthesis;
  function getBritishVoice() {
    const voices = synth.getVoices();
    return voices.find(v => v.lang === 'en-GB' && v.name.includes('Google')) ||
           voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
  }
  function speakWord(text) {
    if (!('speechSynthesis' in window)) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = getBritishVoice(); u.lang = 'en-GB'; u.rate = 0.8;
    synth.speak(u);
  }
  function speakTurkish(text) {
    if (!('speechSynthesis' in window)) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voices = synth.getVoices();
    u.voice = voices.find(v => v.lang.toLowerCase().startsWith('tr')) || null;
    u.lang = 'tr-TR'; u.rate = 0.85;
    synth.speak(u);
  }

  // Düşme sesi (Web Audio API ile sentezlenmiş)
  let audioCtx;
  function playFallSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      // Yüksek frekanstan alçağa doğru kayan bir ses (düşme efekti)
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.6);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    } catch (e) {
      console.log("Ses desteklenmiyor", e);
    }
  }

  /* ===== ÖĞRENME ===== */
  let currentIndex = 0;
  function renderLearnCard() {
    const w = words[currentIndex];
    document.getElementById('learnCard').innerHTML = `
      <span class="visual" style="display:grid;place-items:center;font-size:clamp(76px,18vw,112px);">${w.img}</span>
      <div class="en-word">${w.en}</div>
      <div class="tr-word">${w.tr}</div>
      <div style="margin-top:8px;color:#94a3b8;font-size:13px;font-weight:bold;">Kelime ${currentIndex+1} / ${words.length}</div>`;
  }
  function playCurrentWord() { speakWord(words[currentIndex].en); }
  function nextWord() { currentIndex=(currentIndex+1)%words.length; renderLearnCard(); playCurrentWord(); }
  function prevWord() { currentIndex=(currentIndex-1+words.length)%words.length; renderLearnCard(); playCurrentWord(); }

  /* ===== OYUN ===== */
  let score=0, qCount=1, currentTarget=null, gameLocked=false;
  function initGame() { score=0; qCount=1; document.getElementById('scoreDisp').innerText=score; nextQuestion(); }
  function nextQuestion() {
    gameLocked=false;
    document.getElementById('qCountDisp').innerText=qCount;
    document.getElementById('gameFeedback').innerHTML='';
    currentTarget = words[Math.floor(Math.random()*words.length)];
    document.getElementById('gameQuestion').innerText = currentTarget.tr;
    let options=[currentTarget];
    let filtered = words.filter(w=>w.en!==currentTarget.en).sort(()=>Math.random()-.5);
    options.push(filtered[0], filtered[1], filtered[2]);
    options.sort(()=>Math.random()-.5);
    const container = document.getElementById('gameOptions');
    container.innerHTML='';
    options.forEach(opt=>{
      const btn=document.createElement('button');
      btn.className='option-btn'; btn.innerText=opt.en;
      btn.onclick=()=>checkAnswer(btn,opt.en);
      container.appendChild(btn);
    });
  }
  function checkAnswer(btn, selectedWord) {
    if (gameLocked) return;
    gameLocked=true;
    speakWord(selectedWord);
    if (selectedWord===currentTarget.en) {
      btn.classList.add('correct'); score+=10;
      document.getElementById('scoreDisp').innerText=score;
      document.getElementById('gameFeedback').innerHTML='<span style="color:#116c32;">Harika! Doğru bildin 🌟</span>';
      setTimeout(()=>{ qCount++; nextQuestion(); },1400);
    } else {
      btn.classList.add('wrong');
      Array.from(document.getElementById('gameOptions').children).forEach(b=>{
        if (b.innerText===currentTarget.en) b.classList.add('correct');
      });
      document.getElementById('gameFeedback').innerHTML='<span style="color:#9b1c1c;">Yanlış! Doğrusu: <b>'+currentTarget.en+'</b></span>';
      setTimeout(()=>{ qCount++; nextQuestion(); },2300);
    }
  }

  /* =========================================================
     ZIPLAMA OYUNU
     ========================================================= */
  const jumpCanvas = document.getElementById('jumpCanvas');
  const jumpCtx = jumpCanvas.getContext('2d');
  const jumpTrBanner = document.getElementById('jumpTrBanner');

  let jumpScore=0, jumpCount=1;
  let jumpTarget=null, jumpOptions=[];
  let jumpBusy=false, jumpAnim=null;

  let mX=0, mY=0;
  let standingIndex=-1;
  let platformVisible=true;

  let layout=null;
  let stageW=0, stageH=0, dpr=1;

  function jumpPool() {
    return words.slice();
  }

  function resizeJumpCanvas() {
    const rect = jumpCanvas.parentElement.getBoundingClientRect();
    stageW = Math.max(1, Math.round(rect.width));
    stageH = Math.max(1, Math.round(rect.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    jumpCanvas.width = Math.round(stageW * dpr);
    jumpCanvas.height = Math.round(stageH * dpr);
    jumpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* Düzeltilmiş Yerleşim: Bloklar arası boşluklar açıldı, taşmalar önlendi */
  function computeLayout() {
    const w = stageW, h = stageH;
    
    const bottomArea = Math.min(118, Math.max(82, h * 0.20)); 
    const playableH = h - bottomArea;
    
    // Blokları küçültüp ekrana tam sığdırıyoruz
    const blockW = Math.min(w * 0.29, playableH * 0.34);
    const blockH = Math.min(blockW * 1.05, playableH * 0.38); // Büyük ve okunaklı platform

    // Yatayda tam ortalama
    const topX = w / 2 - blockW / 2;
    const topY = playableH * 0.10;

    // Dikeyde yaprakların birbirine girmemesi için geniş boşluk
    const gapY = Math.max(8, blockH * 0.22); 
    const botY = topY + blockH + gapY;

    // Alttaki iki blok arasındaki yatay boşluk
    const gapX = blockW * 0.15;
    const bot1X = w / 2 - blockW - gapX / 2;
    const bot2X = w / 2 + gapX / 2;

    // Platform (başlangıç yeri)
    const platR = Math.max(18, w * 0.06);
    const platX = Math.max(32, w * 0.12); // Canavarın başlangıç köşesi
    const platY = topY + blockH * 0.2;

    const blocks = [
      { x: topX, y: topY, w: blockW, h: blockH, word: jumpOptions[0] },
      { x: bot1X, y: botY, w: blockW, h: blockH, word: jumpOptions[1] },
      { x: bot2X, y: botY, w: blockW, h: blockH, word: jumpOptions[2] }
    ];

    return { w, h, blocks, platX, platY, platR, blockW, blockH };
  }

  function blockStandY(b) { return b.y + b.h * 0.15; }
  function platformStandY() { return layout.platY - 4; }

  function startJumpGame() {
    if (jumpAnim) cancelAnimationFrame(jumpAnim);
    jumpScore=0; jumpCount=1; jumpBusy=false;
    platformVisible=true;
    standingIndex=-1;
    document.getElementById('jumpScore').textContent=jumpScore;
    document.getElementById('jumpLevel').textContent=1;
    document.getElementById('jumpCount').textContent=jumpCount;
    requestAnimationFrame(()=>{
      resizeJumpCanvas();
      beginRound(true);
    });
  }

  function updateBanner() {
    if (!jumpTarget) { jumpTrBanner.innerHTML = ''; return; }
    jumpTrBanner.textContent = jumpTarget.tr;
  }

  function beginRound(autoplay) {
    jumpBusy=false;
    const pool = jumpPool();
    if (!pool.length) return;

    jumpTarget = pool[Math.floor(Math.random()*pool.length)];
    const distractors = pool.filter(w=>w.en!==jumpTarget.en)
      .sort(()=>Math.random()-.5).slice(0,2);
    jumpOptions = [jumpTarget, ...distractors].sort(()=>Math.random()-.5);

    updateBanner();
    layout = computeLayout();

    // Konum koruma
    if (standingIndex >= 0 && layout.blocks[standingIndex]) {
      const b = layout.blocks[standingIndex];
      mX = b.x + b.w/2;
      mY = blockStandY(b);
    } else {
      mX = layout.platX;
      mY = platformStandY();
      standingIndex = -1;
    }

    document.getElementById('jumpCount').textContent=jumpCount;
    document.getElementById('jumpLevel').textContent=Math.floor((jumpCount-1)/5)+1;
    document.getElementById('jumpFeedback').textContent = 'Türkçesini dinle, doğru İngilizce kelimeye dokun!';
    drawJumpScene();
    if (autoplay) setTimeout(replayJumpWord, 300);
  }

  function replayJumpWord() { if (jumpTarget) speakTurkish(jumpTarget.tr); }

  // Yaprakları bloğun genişliğine tam oturtan fonksiyon
  function drawTirtik(ctx, cx, y, w, color, strokeColor) {
    const startX = cx - w / 2;
    ctx.beginPath();
    ctx.moveTo(startX - 4, y + 10);
    ctx.lineTo(startX, y - 2);
    
    const teethCount = 5; // Tırtık sayısını azalttık ki sığsın
    const step = w / teethCount;
    for (let i = 0; i < teethCount; i++) {
        let tx = startX + i * step;
        ctx.lineTo(tx + step/2, y - 16); 
        ctx.lineTo(tx + step, y - 2);    
    }
    
    ctx.lineTo(startX + w, y - 2);
    ctx.lineTo(startX + w + 4, y + 10);
    ctx.lineTo(startX - 4, y + 10);
    ctx.closePath();
    
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = strokeColor;
    ctx.stroke();
  }

  function drawJumpScene() {
    const ctx=jumpCtx;
    const w=stageW, h=stageH;
    if (w<=0||h<=0) return;
    ctx.clearRect(0,0,w,h);

    // Arka plan
    const sky = ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#4b9df4'); sky.addColorStop(0.62,'#b9e7ff'); sky.addColorStop(1,'#e8f8d5');
    ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
    // Uzak tepeler ve yumuşak bulutlar
    ctx.fillStyle='rgba(255,255,255,.62)';
    [[w*.18,h*.13,23],[w*.72,h*.20,18],[w*.88,h*.09,13]].forEach(([cx,cy,r])=>{ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.arc(cx+r*.8,cy-r*.25,r*.78,0,Math.PI*2);ctx.arc(cx+r*1.55,cy,r*.9,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#8bc9a0'; ctx.beginPath(); ctx.moveTo(0,h*.73); ctx.quadraticCurveTo(w*.2,h*.55,w*.42,h*.74); ctx.quadraticCurveTo(w*.7,h*.52,w,h*.72); ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();

    // Zemin tepeleri
    ctx.fillStyle='#bce39f';
    ctx.beginPath(); ctx.moveTo(0,h*0.82);
    ctx.quadraticCurveTo(w*0.3,h*0.75,w*0.6,h*0.82);
    ctx.quadraticCurveTo(w*0.8,h*0.88,w,h*0.80);
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();

    ctx.fillStyle='#a0d685';
    ctx.beginPath(); ctx.moveTo(0,h*0.92);
    ctx.quadraticCurveTo(w*0.4,h*0.85,w*0.7,h*0.92);
    ctx.quadraticCurveTo(w*0.9,h*0.96,w,h*0.92);
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();

    if (!layout) return;

    // Platform (Başlangıç saksısı)
    if (platformVisible) {
      ctx.save();
      const px = layout.platX, py = layout.platY, pr = layout.platR;
      
      ctx.beginPath();
      ctx.moveTo(px - pr*0.8, py);
      ctx.lineTo(px - pr*0.6, py + pr*1.2);
      ctx.quadraticCurveTo(px, py + pr*1.5, px + pr*0.6, py + pr*1.2);
      ctx.lineTo(px + pr*0.8, py);
      ctx.closePath();
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.strokeStyle='#aeb5b9'; ctx.lineWidth=3; ctx.stroke();

      drawTirtik(ctx, px, py, pr*1.6, '#cceba6', '#9ab882');
      ctx.restore();
    }

    // Bloklar
    layout.blocks.forEach(b=>{
      ctx.save();
      
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 8;

      // Blok Gövdesi
      const r = b.w * 0.35;
      ctx.beginPath();
      ctx.moveTo(b.x + r, b.y);
      ctx.arcTo(b.x + b.w, b.y, b.x + b.w, b.y + b.h, r);
      ctx.arcTo(b.x + b.w, b.y + b.h, b.x, b.y + b.h, r);
      ctx.arcTo(b.x, b.y + b.h, b.x, b.y, r);
      ctx.arcTo(b.x, b.y, b.x + b.w, b.y, r);
      ctx.closePath();
      
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      
      ctx.shadowColor = 'transparent';
      
      ctx.strokeStyle = '#aeb5b9';
      ctx.lineWidth = 5;
      ctx.stroke();

      drawTirtik(ctx, b.x + b.w/2, b.y, b.w, '#cceba6', '#9ab882');

      // Yazı
      ctx.fillStyle='#4a5056';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      
      const maxTextWidth = b.w - 15;
      let fontSize = Math.min(b.h * 0.34, 36);
      ctx.font = `900 ${fontSize}px "Segoe UI", Arial, sans-serif`;
      
      while (ctx.measureText(b.word.en).width > maxTextWidth && fontSize > 10) {
        fontSize -= 2;
        ctx.font = `900 ${fontSize}px "Segoe UI", Arial, sans-serif`;
      }
      
      const parts = b.word.en.split(' ');
      if (parts.length > 1 && b.word.en.length > 9) {
        const mid = Math.ceil(parts.length/2);
        ctx.fillText(parts.slice(0,mid).join(' '), b.x+b.w/2, b.y+b.h*0.45);
        ctx.fillText(parts.slice(mid).join(' '), b.x+b.w/2, b.y+b.h*0.66);
      } else { ctx.fillText(b.word.en, b.x + b.w/2, b.y + b.h*0.55); }
      ctx.restore();
    });

    // Canavar
    drawMonster(ctx, mX, mY, jumpBusy);
  }

  function drawMonster(ctx,px,py,jumping) {
    const sc = Math.max(0.72, Math.min(1.12, Math.min(stageW,stageH)/360));
    ctx.save(); ctx.translate(px,py); ctx.scale(sc,sc);
    if (!jumping) { ctx.translate(0,7); ctx.scale(1.12,0.78); }

    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0,45,18,6,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle='#86c95d'; 
    ctx.strokeStyle='#558c3e'; 
    ctx.lineWidth=2.5;
    
    ctx.beginPath();
    ctx.moveTo(-15,10); 
    ctx.lineTo(-18,-15); ctx.lineTo(-10,-25); ctx.lineTo(-5,-18); ctx.lineTo(0,-30); ctx.lineTo(5,-18); ctx.lineTo(12,-25); ctx.lineTo(18,-15); ctx.lineTo(15,10); 
    ctx.quadraticCurveTo(15, 25, 0, 25);
    ctx.quadraticCurveTo(-15, 25, -15, 10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-6,-5,6,0,Math.PI*2); ctx.arc(6,-5,6,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='#558c3e'; ctx.stroke();

    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.arc(-5,-5,2.5,0,Math.PI*2); ctx.arc(7,-5,2.5,0,Math.PI*2); ctx.fill();

    ctx.strokeStyle='#558c3e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0, 2, 5, 0.1, Math.PI-0.1); ctx.stroke();

    ctx.fillStyle='#f58965';
    ctx.beginPath();
    ctx.moveTo(-14, 10); ctx.lineTo(14, 10); ctx.lineTo(12, 22); ctx.lineTo(-12, 22);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle='#86c95d';
    ctx.beginPath(); ctx.ellipse(-8, 28, 6, 4, 0, 0, Math.PI*2); ctx.ellipse(8, 28, 6, 4, 0, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle='#cc5a5a';
    ctx.beginPath(); ctx.ellipse(-8, 32, 7, 3, 0, 0, Math.PI*2); ctx.ellipse(8, 32, 7, 3, 0, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle='#86c95d'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-15, 5); ctx.lineTo(-20, 15); ctx.moveTo(15, 5); ctx.lineTo(20, 15); ctx.stroke();

    ctx.restore();
  }

  function jumpTo(tx,ty,arcHeight,duration,onDone) {
    const sx=mX, sy=mY;
    const start=performance.now();
    jumpBusy=true;
    function frame(now) {
      const t=Math.min(1,(now-start)/duration);
      mX = sx + (tx-sx)*t;
      mY = sy + (ty-sy)*t - Math.sin(t*Math.PI)*arcHeight;
      drawJumpScene();
      if (t<1) jumpAnim=requestAnimationFrame(frame);
      else { mX=tx; mY=ty; drawJumpScene(); if (onDone) onDone(); }
    }
    jumpAnim=requestAnimationFrame(frame);
  }

  function animateFall(onDone) {
    const sy=mY;
    const targetY = stageH + 80;
    const start=performance.now(), duration=600;
    jumpBusy=true;
    
    // Düşme sesini başlat
    playFallSound();

    function frame(now) {
      const t=Math.min(1,(now-start)/duration);
      mY = sy + (targetY-sy)*t*t;
      drawJumpScene();
      if (t<1) jumpAnim=requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    jumpAnim=requestAnimationFrame(frame);
  }

  function handleBlockClick(idx) {
    if (jumpBusy || !jumpTarget) return;
    const chosen = jumpOptions[idx];
    if (!chosen) return;
    const correct = chosen.en === jumpTarget.en;

    const b = layout.blocks[idx];
    const tx = b.x + b.w/2;
    const ty = blockStandY(b);

    if (platformVisible) {
      platformVisible = false;
      drawJumpScene();
    }

    speakWord(chosen.en);

    if (correct) {
      const arc = Math.min(stageW,stageH)*0.2;
      const dist = Math.abs(tx-mX);
      const duration = 450 + Math.min(300, dist*0.4);
      jumpTo(tx,ty,arc,duration,()=>{
        jumpBusy=false;
        standingIndex=idx;
        jumpScore+=10;
        document.getElementById('jumpScore').textContent=jumpScore;
        document.getElementById('jumpFeedback').innerHTML='🌟 Harika! Doğru blok!';
        setTimeout(()=>{ jumpCount++; beginRound(true); },1000);
      });
    } else {
      jumpTo(tx,ty,Math.min(stageW,stageH)*0.12,300,()=>{
        animateFall(()=>{
          document.getElementById('jumpFeedback').innerHTML =
            'Düştün! Doğru cevap: <b>'+jumpTarget.en+'</b> — tekrar dene!';
          standingIndex=-1;
          platformVisible=true;
          jumpBusy=false;
          layout=computeLayout();
          mX = layout.platX;
          mY = platformStandY();
          drawJumpScene();
          setTimeout(()=>replayJumpWord(),500);
        });
      });
    }
  }

  jumpCanvas.addEventListener('click',function(e){
    if (jumpBusy || !jumpTarget || !layout) return;
    const rect = jumpCanvas.getBoundingClientRect();
    const x = (e.clientX-rect.left)*(stageW/rect.width);
    const y = (e.clientY-rect.top)*(stageH/rect.height);
    let hit=-1;
    layout.blocks.forEach((b,i)=>{
      if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h) hit=i;
    });
    if (hit===-1) return;
    handleBlockClick(hit);
  });

  let resizeTimeout=null;
  function handleResize() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(()=>{
      if (document.getElementById('jumpPanel').classList.contains('active')) {
        resizeJumpCanvas();
        if (jumpTarget) {
          layout = computeLayout();
          if (standingIndex >= 0 && layout.blocks[standingIndex]) {
            const b = layout.blocks[standingIndex];
            mX = b.x+b.w/2; mY = blockStandY(b);
          } else {
            mX = layout.platX; mY = platformStandY();
          }
          drawJumpScene();
        }
      }
    },80);
  }
  window.addEventListener('resize',handleResize);
  window.addEventListener('orientationchange',handleResize);

  const obs = new MutationObserver(()=>{
    if (document.getElementById('jumpPanel').classList.contains('active')) {
      requestAnimationFrame(()=>{
        resizeJumpCanvas();
        if (jumpTarget) {
          layout = computeLayout();
          if (standingIndex < 0) { mX = layout.platX; mY = platformStandY(); }
          drawJumpScene();
        }
      });
    }
  });
  obs.observe(document.getElementById('jumpPanel'),{attributes:true,attributeFilter:['class']});

  if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = getBritishVoice;
  renderLearnCard();
</script>
